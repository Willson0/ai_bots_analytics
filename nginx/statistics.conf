# Внутренний конфиг nginx-контейнера.
# Слушает только HTTP: SSL терминирует хостовый nginx, который проксирует
# префикс /statistics/ сюда (срезая /statistics/ -> запросы приходят как / и /api/).
server {
    listen 80;
    client_max_body_size 999M;

    root /var/www/vue;
    index index.html;

    location /api/ {
        root /var/www/laravel/public;
        index index.php;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/laravel/public;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location /storage/ {
        root /var/www/laravel/public;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri /index.html;
    }
}
