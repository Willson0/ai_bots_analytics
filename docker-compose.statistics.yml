version: '3'

# Наш стек изолирован и НЕ занимает 80/443 — их держит хостовый nginx.
# Наш nginx публикуется только на localhost:8080, куда хостовый nginx
# проксирует префикс /statistics/.

services:
  nginx:
    image: nginx:latest
    restart: always
    container_name: stats_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./backend:/var/www/laravel
      - ./frontend/dist:/var/www/vue
    depends_on:
      - php
      - frontend

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: stats_php
    restart: always
    volumes:
      - ./backend:/var/www/laravel
    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    restart: always
    container_name: stats_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    ports:
      - "127.0.0.1:8101:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci

  frontend:
    image: node:20
    restart: always
    container_name: stats_frontend
    volumes:
      - ./frontend:/var/www/vue
    working_dir: /var/www/vue
    command: bash -c "npm install && npm run build && tail -f /dev/null"
